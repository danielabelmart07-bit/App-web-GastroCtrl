
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroCtrl | Acceso administrativo</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: {
                            50: '#fcfaf7',
                            100: '#f7f3ed',
                            200: '#efe6d8',
                            300: '#e3d2be',
                        },
                        coffee: {
                            500: '#a67c52',
                            600: '#8c6343',
                            700: '#6e4b30',
                            800: '#4e3320',
                            900: '#332013',
                        },
                        terracotta: '#b87d4b',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="min-h-screen bg-cream-50 font-sans text-coffee-900 flex flex-col">

    <header class="border-b border-cream-200 bg-white/90">
        <div class="max-w-7xl mx-auto px-6 py-5">
            <a href="{% url 'cliente:home' %}" class="inline-flex items-center gap-3">
                <span class="w-11 h-11 rounded-full bg-coffee-500/10 border border-coffee-500/20 flex items-center justify-center text-coffee-600">
                    <i class="fa-solid fa-wheat-awn text-lg"></i>
                </span>
                <span>
                    <span class="block font-serif text-2xl font-bold">GastroCtrl</span>
                    <span class="block text-[10px] uppercase tracking-[0.2em] text-coffee-600">
                        Café &amp; Pastelería
                    </span>
                </span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <section class="w-full max-w-md">

            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-coffee-500/10 text-coffee-600 border border-coffee-500/20 mb-5">
                    <i class="fa-solid fa-user-shield text-2xl"></i>
                </div>

                <h1 class="font-serif text-3xl sm:text-4xl font-bold">
                    Acceso administrativo
                </h1>

                <p class="mt-3 text-sm text-coffee-700/75">
                    Ingresá a tu panel de gestión de GastroCtrl.
                </p>
            </div>

            <div class="bg-white rounded-3xl border border-cream-200 shadow-xl shadow-coffee-900/5 p-7 sm:p-8">

                {% if error %}
                    <div role="alert"
                         class="mb-6 flex gap-3 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">
                        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                        <p>{{ error }}</p>
                    </div>
                {% endif %}

                <form method="POST" action="{% url 'administrador:login' %}" class="space-y-5">
                    {% csrf_token %}

                    <div>
                        <label for="username"
                               class="block text-sm font-semibold mb-2">
                            Usuario
                        </label>

                        <div class="relative">
                            <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-coffee-500"></i>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                autocomplete="username"
                                required
                                autofocus
                                placeholder="Tu usuario"
                                class="w-full rounded-xl border border-cream-300 bg-cream-50 py-3.5 pl-11 pr-4 text-sm outline-none transition focus:border-coffee-500 focus:ring-4 focus:ring-coffee-500/10"
                            >
                        </div>
                    </div>

                    <div>
                        <label for="password"
                               class="block text-sm font-semibold mb-2">
                            Contraseña
                        </label>

                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-coffee-500"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required
                                placeholder="Tu contraseña"
                                class="w-full rounded-xl border border-cream-300 bg-cream-50 py-3.5 pl-11 pr-4 text-sm outline-none transition focus:border-coffee-500 focus:ring-4 focus:ring-coffee-500/10"
                            >
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="w-full rounded-xl bg-coffee-600 hover:bg-coffee-700 text-white font-semibold py-3.5 px-4 shadow-md shadow-coffee-900/10 transition flex items-center justify-center gap-2"
                    >
                        <span>Ingresar al panel</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>

                <div class="mt-6 pt-5 border-t border-cream-200 text-center">
                    <a href="{% url 'cliente:home' %}"
                    class="text-sm text-coffee-600 hover:text-coffee-800 transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i>
                        Volver a la tienda
                    </a>
                </div>
            </div>

            <p class="text-center text-xs text-coffee-700/60 mt-6">
                Acceso exclusivo para usuarios autorizados.
            </p>
        </section>
    </main>

    <footer class="text-center text-xs text-coffee-700/60 px-4 py-5">
        © 2026 GastroCtrl. Todos los derechos reservados.
    </footer>

</body>
</html>
