<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Confirmar eliminación | GastroCtrl</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></head>
<body class="min-h-screen bg-stone-50 text-stone-900 font-sans flex items-center justify-center p-4"><main class="w-full max-w-xl rounded-3xl border border-stone-200 bg-white p-6 sm:p-9 shadow-xl"><div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-50 text-red-700 text-xl" aria-hidden="true">!</div><p class="mt-5 text-xs font-bold uppercase tracking-widest text-stone-500">GastroCtrl · Panel administrativo</p><h1 class="mt-2 text-2xl font-bold">Confirmar eliminación</h1><p class="mt-4 text-stone-700">¿Seguro que querés eliminar la {{ tipo }} <strong>{{ objeto }}</strong>?</p><p class="mt-2 text-sm text-stone-600">{{ mensaje }}</p>{% if bloqueado %}<p role="alert" class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900">Esta categoría tiene productos asociados y no puede eliminarse todavía.</p>{% endif %}<div class="mt-7 flex flex-wrap gap-3"><a href="{% url 'administrador:dashboard' %}" class="rounded-xl bg-stone-100 px-4 py-3 font-semibold text-stone-800 hover:bg-stone-200">Cancelar</a>{% if not bloqueado %}<form method="post">{% csrf_token %}<button type="submit" class="rounded-xl bg-red-700 px-4 py-3 font-semibold text-white hover:bg-red-800">Sí, eliminar</button></form>{% endif %}</div></main></body></html>
